<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXERCISE-1</title>
    <!-- STYLING -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color: #414141;
      }

      .images {
        list-style: none;
        max-width: 300px;
        width: 80%;
        text-align: center;
        color: rgb(247, 59, 219);
        object-fit: cover;
        margin: 0 auto;
      }

      .images img {
        width: 100%;
        border-radius: 20px;
        margin: 6px;
        box-shadow: 2px 2px 10px rgb(25, 25, 25);
      }
    </style>
  </head>
  <body>
    <!-- ---------------JS EVENT PRACTICE----------------------------- -->
    <ul class="images">
      <h1 style="text-decoration: underline; color: #ffff; margin-bottom: 20px">
        JS EVENTS
      </h1>
      <h2>Click On An Image To Remove It</h2>
      <li><img src="./Assets/download.jpg" alt="" /></li>
      <li><img src="./Assets/download (1).jpg" alt="" /></li>
      <li><img src="./Assets/download (2).jpg" alt="" /></li>
      <li><img src="./Assets/download (3).jpg" alt="" /></li>
      <li><img src="./Assets/download (4).jpg" alt="" /></li>
      <li><img src="./Assets/download (5).jpg" alt="" /></li>
      <li><img src="./Assets/download (6).jpg" alt="" /></li>
    </ul>

    <!-- JAVA-SCRIPT -->
    <script>
      let ul = document.querySelector(".images");

      //using an event handler
      ul.addEventListener("click", (e) => {
        //to remove the selected img using it tagName value to specify it
        if (e.target.tagName === "IMG") {
          let removeIt = e.target.parentNode;
          removeIt.remove();
        }
      });
    </script>
  </body>
</html>
